<section class="card">
  <h1>Mon profil</h1>
  <button type="button" (click)="load()">Recharger mon profil</button>
  @if (loadError()) {
    <p class="error">{{ loadError() }}</p>
  }
  @if (auth.currentUser(); as user) {
    <p>
      <b>{{ user.name }}</b><br />{{ user.email }}<br />
      Membre depuis {{ user.createdAt.slice(0, 10) }}
    </p>
    <form [formGroup]="form" (ngSubmit)="save()">
      <label>Nouveau nom<input formControlName="name" /></label>
      <button type="submit">Enregistrer</button>
    </form>
    @if (saveMessage()) {
      <p class="success">{{ saveMessage() }}</p>
    }
    @if (saveError()) {
      <p class="error">{{ saveError() }}</p>
    }
  }
</section>
