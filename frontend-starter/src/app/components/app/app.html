<header>
  <div>
    <b>Guitar Practice Cloud</b>
    <small>Le cloud qui manque à votre ampli</small>
  </div>
  <nav aria-label="Navigation principale">
    <a routerLink="/tracks" routerLinkActive="active">Backing tracks</a>
    @if (auth.token()) {
      <a routerLink="/profile" routerLinkActive="active">Profil</a>
      <button type="button" (click)="logout()">Déconnexion</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Connexion</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
